
services:
  airflow:
    image: apache/airflow:2.10.5
    container_name: food_waste_airflow
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data

  postgres:
    image: postgres:16
    container_name: ecobite_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecobite_db
      POSTGRES_USER: ecobite_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - ecobite_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecobite_user -d ecobite_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ecobite_postgres_data:
